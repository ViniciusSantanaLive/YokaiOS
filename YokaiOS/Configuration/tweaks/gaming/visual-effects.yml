# Visual Effects Optimization
# Disable unnecessary visual effects for gaming
#
# Raiz e um mapping UninstallTask: o engine do AME faz Deserialize<UninstallTask>
# por arquivo e rejeita raiz em lista. Sub-tarefa virou comentario; `option:` de
# sub-tarefa foi propagado pras actions dela.

---
title: Visual Effects Optimization
description: Disable unnecessary visual effects for gaming
privilege: Admin
actions:

  # === Disable Visual Effects
  # Remove animations and effects that consume GPU
  - !registryValue
    path: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\VisualEffects"
    value: "VisualFXSetting"
    type: "REG_DWORD"
    data: "2"
  - !registryValue
    path: "HKCU\\Control Panel\\Desktop"
    value: "UserPreferencesMask"
    type: "REG_BINARY"
    data: "9012038010000000"
  - !registryValue
    path: "HKCU\\Control Panel\\Desktop"
    value: "DragFullWindows"
    type: "REG_SZ"
    data: "0"
  - !registryValue
    path: "HKCU\\Control Panel\\Desktop"
    value: "FontSmoothing"
    type: "REG_SZ"
    data: "0"
  - !registryValue
    path: "HKCU\\Control Panel\\Desktop\\WindowMetrics"
    value: "MinAnimate"
    type: "REG_SZ"
    data: "0"

  # === Disable Transparency
  # Disable Aero transparency for better performance
  - !registryValue
    path: "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Themes\\Personalize"
    value: "EnableTransparency"
    type: "REG_DWORD"
    data: "0"

  # === Disable Cursor Shadow
  # Remove cursor shadow effect
  - !registryValue
    path: "HKCU\\Control Panel\\Cursors"
    value: "CursorShadow"
    type: "REG_DWORD"
    data: "0"
