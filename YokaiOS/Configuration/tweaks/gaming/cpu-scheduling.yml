# CPU Scheduling Optimization for Gaming
# Prioritizes foreground game processes
#
# Raiz e um mapping UninstallTask: o engine do AME faz Deserialize<UninstallTask>
# por arquivo e rejeita raiz em lista. Sub-tarefa virou comentario; `option:` de
# sub-tarefa foi propagado pras actions dela.

---
title: CPU Scheduling Optimization for Gaming
description: Prioritizes foreground game processes
privilege: Admin
actions:

  # === Optimize CPU Priority for Games
  # Set CPU priority class for foreground applications
  - !registryValue
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\PriorityControl"
    value: "Win32PrioritySeparation"
    type: "REG_DWORD"
    data: "38"

  # === Disable CPU Core Parking
  # Prevent CPU cores from sleeping during gaming
  - !registryValue
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Power\\PowerSettings\\54533251-82be-4824-96c1-47b60b740d00\\0cc5b647-c1df-4637-891a-dec35c318583"
    value: "Attributes"
    type: "REG_DWORD"
    data: "0"

  # === Disable Dynamic Tick
  # Prevent CPU from entering low-power states
  - !cmd
    command: "bcdedit /set disabledynamictick yes"

  # === Set Platform Clock
  # Force use of platform clock for consistent timing
  - !cmd
    command: "bcdedit /set useplatformclock true"
  - !cmd
    command: "bcdedit /set useplatformtick yes"

  # === Optimize Thread Quantum
  # Reduce thread quantum for better responsiveness
  - !registryValue
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\PriorityControl"
    value: "IRQ8Priority"
    type: "REG_DWORD"
    data: "1"
