# BCDedit Optimizations
# Boot configuration optimizations for gaming
#
# Raiz e um mapping UninstallTask: o engine do AME faz Deserialize<UninstallTask>
# por arquivo e rejeita raiz em lista. Sub-tarefa virou comentario; `option:` de
# sub-tarefa foi propagado pras actions dela.

---
title: BCDedit Optimizations
description: Boot configuration optimizations for gaming
privilege: Admin
actions:

  # === Disable Dynamic Tick
  # Prevent CPU from entering low-power states
  - !cmd
    command: "bcdedit /set disabledynamictick yes"

  # === Set Platform Clock
  # Force use of platform clock for consistent timing
  - !cmd
    command: "bcdedit /set useplatformclock true"
  - !cmd
    command: "bcdedit /set useplatformtick yes"

  # === Set TSC Sync Policy
  # Configure TSC synchronization for better performance
  - !cmd
    command: "bcdedit /set tscsyncpolicy enhanced"

  # === Disable Boot Log
  # Disable boot logging for faster boot
  - !cmd
    command: "bcdedit /set bootlog no"

  # === Disable Boot Menu
  # Skip boot menu for faster boot
  - !cmd
    command: "bcdedit /set bootmenupolicy standard"

  # === Set Timeout
  # Set boot timeout to 0
  - !cmd
    command: "bcdedit /timeout 0"

  # === Disable Integrity Checks
  # Disable driver integrity checks for performance
  - !cmd
    command: "bcdedit /set nointegritychecks yes"

  # === Disable Debug
  # Disable kernel debugging
  - !cmd
    command: "bcdedit /debug off"
  - !cmd
    command: "bcdedit /set debug no"
