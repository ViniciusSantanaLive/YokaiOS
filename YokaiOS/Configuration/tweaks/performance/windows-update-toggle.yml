# Windows Update Configuration
# Toggles Windows Update based on user selection
#
# Raiz e um mapping UninstallTask: o engine do AME faz Deserialize<UninstallTask>
# por arquivo e rejeita raiz em lista. Sub-tarefa virou comentario; `option:` de
# sub-tarefa foi propagado pras actions dela.

---
title: Windows Update Configuration
description: Toggles Windows Update based on user selection
privilege: Admin
actions:

  # === Disable Windows Update
  # Disable automatic Windows updates for gaming
  - !service: {name: 'wuauserv', operation: change, startup: 4, option: 'updates-disable'}
  - !service: {name: 'UsoSvc', operation: change, startup: 4, option: 'updates-disable'}
  - !service: {name: 'DoSvc', operation: change, startup: 4, option: 'updates-disable'}
  - !registryValue
    option: "updates-disable"
    path: "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    value: "NoAutoUpdate"
    type: "REG_DWORD"
    data: "1"
  - !registryValue
    option: "updates-disable"
    path: "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    value: "AUOptions"
    type: "REG_DWORD"
    data: "1"

  # === Notify Only About Updates
  # Show notifications but don't auto-install
  - !service: {name: 'wuauserv', operation: change, startup: 3, option: 'updates-notify'}
  - !registryValue
    option: "updates-notify"
    path: "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    value: "NoAutoUpdate"
    type: "REG_DWORD"
    data: "0"
  - !registryValue
    option: "updates-notify"
    path: "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    value: "AUOptions"
    type: "REG_DWORD"
    data: "2"

  # === Keep Windows Update Default
  # Keep automatic updates enabled
  - !service: {name: 'wuauserv', operation: change, startup: 2, option: 'updates-default'}
  - !registryValue
    option: "updates-default"
    path: "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    value: "NoAutoUpdate"
    type: "REG_DWORD"
    data: "0"
  - !registryValue
    option: "updates-default"
    path: "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    value: "AUOptions"
    type: "REG_DWORD"
    data: "4"
