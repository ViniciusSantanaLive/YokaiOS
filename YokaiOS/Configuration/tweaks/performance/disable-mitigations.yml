# Disable Mitigations
# CPU security mitigations - balanced for gaming + anti-cheat compatibility
# Follows ReviOS approach: disable heavy mitigations, keep critical ones for anti-cheats
#
# Raiz e um mapping UninstallTask: o engine do AME faz Deserialize<UninstallTask>
# por arquivo e rejeita raiz em lista. Sub-tarefa virou comentario; `option:` de
# sub-tarefa foi propagado pras actions dela.

---
title: Disable Mitigations
description: CPU security mitigations - balanced for gaming + anti-cheat compatibility
privilege: Admin
actions:

  # === Anti-Cheat Compatibility Notes ===
  # YokaiOS keeps the following for anti-cheat compatibility:
  #   - CFG (Control Flow Guard) - Required by Vanguard (Valorant)
  #   - ASLR (Address Space Layout Randomization) - Required by osu!
  #   - DEP (Data Execution Prevention) - Required by most anti-cheats
  # These are NOT disabled to prevent bans and maintain game compatibility.

  # === Disable Spectre Mitigations
  # Disable Spectre mitigations for better performance
  - !registryValue
    option: "mitigations-disable"
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
    value: "FeatureSettingsOverride"
    type: "REG_DWORD"
    data: "3"
  - !registryValue
    option: "mitigations-disable"
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
    value: "FeatureSettingsOverrideMask"
    type: "REG_DWORD"
    data: "3"

  # === Disable SEHOP
  # Disable Structured Exception Handling Overwrite Protection for performance
  - !registryValue
    option: "mitigations-disable"
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\kernel"
    value: "DisableExceptionChainValidation"
    type: "REG_DWORD"
    data: "1"

  # === Disable Core Isolation (VBS/HVCI)
  # Disable Virtualization-Based Security for gaming performance
  - !registryValue
    option: "mitigations-disable"
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard"
    value: "EnableVirtualizationBasedSecurity"
    type: "REG_DWORD"
    data: "0"
  - !registryValue
    option: "mitigations-disable"
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard"
    value: "RequirePlatformSecurityFeatures"
    type: "REG_DWORD"
    data: "0"
  - !registryValue
    option: "mitigations-disable"
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard\\Scenarios\\HypervisorEnforcedCodeIntegrity"
    value: "Enabled"
    type: "REG_DWORD"
    data: "0"

  # === Keep Mitigations Default
  # Keep CPU security mitigations enabled (default)
  - !registryValue
    option: "mitigations-default"
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
    value: "FeatureSettingsOverride"
    type: "REG_DWORD"
    data: "0"
  - !registryValue
    option: "mitigations-default"
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
    value: "FeatureSettingsOverrideMask"
    type: "REG_DWORD"
    data: "0"
  - !registryValue
    option: "mitigations-default"
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard"
    value: "EnableVirtualizationBasedSecurity"
    type: "REG_DWORD"
    data: "1"

# === KEPT FOR ANTI-CHEAT COMPATIBILITY ===
# ASLR is NOT disabled (MoveImages stays at default 1)
# DEP is NOT disabled (bcdedit /set nx AlwaysOff is NOT applied)
# CFG is NOT disabled (required by Vanguard/Valorant)
# These mitigations have minimal performance impact but are critical for anti-cheat systems.
