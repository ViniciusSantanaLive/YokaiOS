# Disk Optimization
# Optimizes disk I/O for gaming
#
# Raiz e um mapping UninstallTask: o engine do AME faz Deserialize<UninstallTask>
# por arquivo e rejeita raiz em lista. Sub-tarefa virou comentario; `option:` de
# sub-tarefa foi propagado pras actions dela.

---
title: Disk Optimization
description: Optimizes disk I/O for gaming
privilege: Admin
actions:

  # === Disable NTFS Last Access Time
  # Prevents updating file access timestamps
  - !registryValue
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\FileSystem"
    value: "NtfsDisableLastAccessUpdate"
    type: "REG_DWORD"
    data: "80000003"

  # === Disable 8.3 Name Creation
  # Disables legacy short filename creation
  - !registryValue
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\FileSystem"
    value: "NtfsDisable8dot3NameCreation"
    type: "REG_DWORD"
    data: "1"

  # === Optimize NTFS Memory Usage
  # Configure NTFS paged pool memory
  - !registryValue
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\FileSystem"
    value: "NtfsPagedPoolSize"
    type: "REG_DWORD"
    data: "0"
  - !registryValue
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\FileSystem"
    value: "NtfsNonPagedPoolSize"
    type: "REG_DWORD"
    data: "0"

  # === Disable Bandwidth Limit
  # Remove network bandwidth reservation
  - !registryValue
    path: "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Psched"
    value: "NonBestEffortLimit"
    type: "REG_DWORD"
    data: "0"

  # === Disable Background Disk Defragmentation
  # Prevent background defrag during gaming
  - !registryValue
    path: "HKLM\\SOFTWARE\\Microsoft\\Dfrg\\BootOptimizeFunction"
    value: "Enable"
    type: "REG_SZ"
    data: "N"
